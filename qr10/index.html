<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=yes">
<meta name="theme-color" content="#000000">
<title>QR10 — La réunion</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
button{font:inherit}

.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:18px;background:#000;opacity:0;transition:opacity .45s ease}
.screen.active{display:flex;opacity:1}
.screen.fading{opacity:0}
.mainText{width:min(92vw,760px);font-size:clamp(20px,4.6vmin,29px);line-height:1.48;white-space:pre-line}
.sub{display:block;margin-top:18px;color:#bbb;font-size:clamp(16px,3.3vmin,20px);line-height:1.4}

#startBtn{display:block;width:min(88vw,360px);padding:20px 28px;border:0;border-radius:8px;background:#fff;color:#000;font-size:clamp(20px,5vmin,26px);cursor:pointer;animation:pulse 1.5s infinite}
#restartBtn{display:none;position:fixed;left:50%;bottom:32px;transform:translateX(-50%);z-index:100;width:min(82vw,320px);padding:15px 24px;border:0;border-radius:8px;background:#fff;color:#000;font-size:clamp(18px,4vmin,23px);cursor:pointer}

#countdown{font-family:"Courier New",monospace;font-size:clamp(72px,22vmin,140px);text-shadow:0 0 20px #fff}

#sceneScreen{padding:0}
#sceneWrap{position:relative;width:min(96vw,82vh);height:min(96vw,82vh);line-height:0}
#sceneImg{display:block;width:100%;height:100%;object-fit:contain}
.zone{position:absolute;border:2px solid transparent;border-radius:7px;background:transparent;cursor:pointer;color:#fff}
.zone:focus-visible{outline:3px solid #fff;outline-offset:2px}
.zone.active{border-color:#fff;background:rgba(255,255,255,.10)}
.zone.seen{border-color:rgba(255,255,255,.35)}
.zoneLabel{position:absolute;left:50%;bottom:calc(100% + 4px);transform:translateX(-50%);padding:4px 8px;border:1px solid rgba(255,255,255,.35);border-radius:5px;background:rgba(0,0,0,.9);font-size:clamp(13px,2.8vmin,17px);line-height:1.15;white-space:nowrap;opacity:0;pointer-events:none}
.zone.active .zoneLabel,.zone:focus-visible .zoneLabel{opacity:1}

#sceneHint{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:30;width:max-content;max-width:88vw;padding:9px 14px;border-radius:8px;background:rgba(0,0,0,.82);font-size:clamp(15px,3.2vmin,19px);line-height:1.25}
#sceneProgress{position:fixed;left:12px;top:12px;z-index:35;padding:8px 11px;border:1px solid rgba(255,255,255,.4);border-radius:7px;background:rgba(0,0,0,.82);font-size:clamp(14px,3vmin,18px);line-height:1.2}
#sceneContinue{display:none;position:fixed;right:12px;top:12px;z-index:35;padding:10px 14px;border:0;border-radius:7px;background:#fff;color:#000;font-size:clamp(15px,3.3vmin,19px);cursor:pointer}

#tooltip{display:none;position:fixed;left:0;right:0;bottom:0;z-index:80;padding:18px 18px 20px;border-top:1px solid rgba(255,255,255,.28);background:rgba(0,0,0,.96);text-align:center;line-height:1.45}
#tooltipName{display:block;margin-bottom:7px;font-size:clamp(20px,4.7vmin,27px);letter-spacing:.04em;text-transform:uppercase}
#tooltipDesc{font-size:clamp(17px,3.7vmin,22px)}
#tooltipClose{display:block;margin:15px auto 0;padding:11px 22px;border:0;border-radius:7px;background:#fff;color:#000;font-size:clamp(16px,3.4vmin,20px);cursor:pointer}
#journeyScreen{overflow-y:auto;justify-content:flex-start;padding:5vh 18px}
#journeyCard{width:min(92vw,720px);margin:auto;padding:24px;border:1px solid #555;border-radius:12px;background:#101010;text-align:left}
#journeyCard h1{font-size:clamp(25px,5.5vmin,34px);margin-bottom:18px;text-align:center}
#journeyCard p{font-size:clamp(17px,3.7vmin,22px);line-height:1.45;margin:10px 0}
#journeyList{margin:14px 0 4px;padding-left:22px}
#journeyList li{font-size:clamp(16px,3.4vmin,20px);line-height:1.4;margin:9px 0}
#journeyNote{color:#bbb;font-size:clamp(15px,3.1vmin,18px)!important;margin-top:18px!important}
#backToBook{display:block;margin:22px auto 0;padding:14px 22px;border:0;border-radius:8px;background:#fff;color:#000;font-size:clamp(18px,4vmin,23px);cursor:pointer}

@keyframes pulse{0%,100%{opacity:1}50%{opacity:.67}}
@media (prefers-reduced-motion:reduce){.screen{transition:none}#startBtn{animation:none}}
</style>
</head>
<body>

<button id="startBtn" type="button">Touche pour commencer</button>
<button id="restartBtn" type="button">Recommencer</button>

<section id="textScreen" class="screen" aria-live="polite">
  <div id="mainText" class="mainText"></div>
</section>

<section id="countdownScreen" class="screen" aria-live="polite">
  <div id="countdown"></div>
</section>

<section id="sceneScreen" class="screen" aria-live="polite">
  <div id="sceneWrap">
    <img id="sceneImg" src="touslessuspects.webp" alt="Réunion dans le bureau de Mme Arnaud avec Rémy, M. Vidal, Noé, Inès, Sam et Chloé">

    <button class="zone" type="button" data-who="Rémy" aria-label="Observer Rémy" style="left:4.8%;top:20.5%;width:16.8%;height:55%"><span class="zoneLabel">Rémy</span></button>
    <button class="zone" type="button" data-who="Vidal" aria-label="Observer M. Vidal" style="left:24.8%;top:14.5%;width:12.5%;height:23%"><span class="zoneLabel">Vidal</span></button>
    <button class="zone" type="button" data-who="Inès" aria-label="Observer Inès" style="left:60%;top:20%;width:13.5%;height:40%"><span class="zoneLabel">Inès</span></button>
    <button class="zone" type="button" data-who="Sam" aria-label="Observer Sam" style="left:73%;top:23.5%;width:9%;height:37%"><span class="zoneLabel">Sam</span></button>
    <button class="zone" type="button" data-who="Noé" aria-label="Observer Noé" style="left:30%;top:41.5%;width:23.5%;height:38.5%"><span class="zoneLabel">Noé</span></button>
    <button class="zone" type="button" data-who="Chloé" aria-label="Observer Chloé" style="left:82%;top:28%;width:15.5%;height:58.5%"><span class="zoneLabel">Chloé</span></button>
  </div>

  <div id="sceneProgress">0/6 observés</div>
  <button id="sceneContinue" type="button">Continuer</button>
  <div id="sceneHint">Écoute…</div>
</section>

<section id="journeyScreen" class="screen" aria-live="polite">
  <div id="journeyCard">
    <h1>Ton parcours de lecteur</h1>
    <p id="journeyCount"></p>
    <ul id="journeyList"></ul>
    <p id="journeyNote">Ce n’est ni une note ni un test. C’est le chemin que tu as suivi dans l’histoire.</p>
    <button id="backToBook" type="button">Reprendre le roman</button>
  </div>
</section>

<aside id="tooltip" aria-live="polite">
  <strong id="tooltipName"></strong>
  <div id="tooltipDesc"></div>
  <button id="tooltipClose" type="button">Fermer</button>
</aside>

<audio id="narrateur" src="narrateur.mp3" preload="auto" playsinline></audio>
<audio id="porte" src="porte.mp3" preload="auto" playsinline></audio>

<script>
function trackScan(id){
  try{
    const usedSet=new Set(JSON.parse(localStorage.getItem("qr_used_set")||"[]"));
    usedSet.add(id);
    const arr=Array.from(usedSet);
    localStorage.setItem("qr_used_set",JSON.stringify(arr));
    localStorage.setItem("scans_used",arr.length);
    localStorage.setItem("scans_total","11");
  }catch(error){console.error("Storage error:",error)}
}

const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const startBtn=document.getElementById("startBtn");
const restartBtn=document.getElementById("restartBtn");
const textScreen=document.getElementById("textScreen");
const mainText=document.getElementById("mainText");
const countdownScreen=document.getElementById("countdownScreen");
const countdown=document.getElementById("countdown");
const sceneScreen=document.getElementById("sceneScreen");
const sceneHint=document.getElementById("sceneHint");
const sceneProgress=document.getElementById("sceneProgress");
const sceneContinue=document.getElementById("sceneContinue");
const tooltip=document.getElementById("tooltip");
const tooltipName=document.getElementById("tooltipName");
const tooltipDesc=document.getElementById("tooltipDesc");
const tooltipClose=document.getElementById("tooltipClose");
const journeyScreen=document.getElementById("journeyScreen");
const journeyCount=document.getElementById("journeyCount");
const journeyList=document.getElementById("journeyList");
const backToBook=document.getElementById("backToBook");
const narrateur=document.getElementById("narrateur");
const porte=document.getElementById("porte");
const screens=[textScreen,countdownScreen,sceneScreen,journeyScreen];

const descriptions={
  Rémy:"Le bras en écharpe, il préférerait même l’hôpital à cet endroit.",
  Vidal:"Bras croisés. Son poignet gauche est nu.",
  Inès:"Debout. Prête à faire émerger la vérité.",
  Sam:"Tendu, son avenir se joue maintenant.",
  Noé:"Assis près de Sam. Il s'en veut.",
  Chloé:"Arrivée la dernière. Elle fixe ses mains."
};

const carnetBridge={
  LAVELOT:{entry:"LAVELOT S.",person:"Sam"},
  MOREL:{entry:"MOREL N.",person:"Noé"},
  DUBOIS:{entry:"DUBOIS C.",person:"Chloé"}
};

const seen=new Set();
const suspectOrder=[];
let zonesUnlocked=false;

function activate(screen){
  screens.forEach(item=>item.classList.remove("active","fading"));
  screen.classList.add("active");
}

async function fade(screen){
  screen.classList.add("fading");
  await sleep(450);
  screen.classList.remove("active","fading");
}

async function showText(content,hold){
  mainText.textContent=content;
  activate(textScreen);
  await sleep(hold);
  await fade(textScreen);
}

function playSafely(media){
  try{
    media.currentTime=0;
    const promise=media.play();
    if(promise)promise.catch(()=>{});
  }catch(error){console.warn("Lecture audio impossible:",error)}
}

function waitForSound(media,maxMs){
  return new Promise(resolve=>{
    let finished=false;
    const done=()=>{
      if(finished)return;
      finished=true;
      media.removeEventListener("ended",done);
      media.removeEventListener("error",done);
      resolve();
    };
    media.addEventListener("ended",done,{once:true});
    media.addEventListener("error",done,{once:true});
    setTimeout(done,maxMs);
  });
}

async function runCountdown(){
  activate(countdownScreen);
  for(let value=3;value>=1;value--){
    countdown.textContent=value;
    await sleep(850);
  }
  countdown.textContent="";
  await fade(countdownScreen);
}

function updateProgress(){
  sceneProgress.textContent=`${seen.size}/6 observés`;
  if(seen.size>=1)sceneContinue.style.display="block";
  if(seen.size===6)sceneContinue.textContent="J’ai tout observé";
}

function closeTooltip(){
  tooltip.style.display="none";
  document.querySelectorAll(".zone").forEach(zone=>zone.classList.remove("active"));
}

function openTooltip(zone){
  if(!zonesUnlocked)return;
  const who=zone.dataset.who;
  document.querySelectorAll(".zone").forEach(item=>item.classList.remove("active"));
  zone.classList.add("active","seen");

  if(!seen.has(who)){
    seen.add(who);
    suspectOrder.push(who);
    updateProgress();
  }

  tooltipName.textContent=who;
  let description=descriptions[who];
  if(who==="Inès"&&localStorage.getItem("qr4_ines_choice")){
    description+=" Tu l’avais déjà imaginée : garde ton propre visage d’Inès.";
  }
  tooltipDesc.textContent=description;
  tooltip.style.display="block";
}

function exploreScene(){
  return new Promise(resolve=>{
    document.querySelectorAll(".zone").forEach(zone=>{
      zone.addEventListener("click",()=>openTooltip(zone));
    });
    tooltipClose.addEventListener("click",()=>{
      closeTooltip();
      if(seen.size===6)sceneContinue.click();
    });
    sceneContinue.addEventListener("click",()=>{
      closeTooltip();
      resolve();
    },{once:true});
  });
}

function readJSON(key,fallback){
  try{return JSON.parse(localStorage.getItem(key)||JSON.stringify(fallback))}catch(error){return fallback}
}

function reasonText(code){
  if(code==="appui")return "avoir un coup de pouce";
  if(code==="comparaison")return "comparer avec ton propre film";
  if(code==="curiosite")return "découvrir ce qui se cachait derrière le QR";
  return "";
}

function articleFor(value){
  if(value==="caméra")return "la caméra";
  if(value==="fumée")return "la fumée";
  if(value==="carnet")return "le carnet";
  return value;
}

function carnetLabel(value){
  const labels={LAVELOT:"LAVELOT S.",MOREL:"MOREL N.",DUBOIS:"DUBOIS C."};
  return labels[(value||"").toUpperCase()]||value;
}

function addJourneyLine(content){
  const item=document.createElement("li");
  item.textContent=content;
  journeyList.appendChild(item);
}

function buildJourney(firstLook){
  journeyList.replaceChildren();
  const used=new Set(readJSON("qr_used_set",[]));
  const total=Number(localStorage.getItem("scans_total")||11);
  journeyCount.textContent=`Sur cet appareil, tu as ouvert ${used.size} rendez-vous sur ${total}.`;

  const reasons=readJSON("qr_scan_reasons",{});
  const moments=[
    ["Au début",reasons.qr1||localStorage.getItem("qr1_scan_reason")],
    ["Dans le bureau de Mme Arnaud",reasons.qr6||localStorage.getItem("qr6_scan_reason")],
    ["Avant d’entrer chez Vidal",reasons.qr9||localStorage.getItem("qr9_scan_reason")]
  ].filter(([,reason])=>reasonText(reason));
  moments.forEach(([label,reason])=>addJourneyLine(`${label}, tu as scanné pour ${reasonText(reason)}.`));

  const firstEvidence=localStorage.getItem("qr6_first");
  if(firstEvidence)addJourneyLine(`Tu as regardé ${articleFor(firstEvidence)} en premier dans le bureau de Mme Arnaud.`);
  const firstEntry=localStorage.getItem("qr9_carnet_first");
  if(firstEntry)addJourneyLine(`Dans le carnet de Vidal, tu as commencé par ${carnetLabel(firstEntry)}.`);
  if(firstLook)addJourneyLine(`Pendant la réunion, ton regard s’est d’abord posé sur ${firstLook}.`);

  if(journeyList.children.length===0){
    addJourneyLine("Tes choix précédents ne sont pas enregistrés sur cet appareil.");
  }
}

async function run(){
  trackScan("qr10");
  startBtn.style.display="none";

  const firstCarnet=(localStorage.getItem("qr9_carnet_first")||"").toUpperCase();
  const bridge=carnetBridge[firstCarnet];
  if(bridge){
    await showText(`Dans le carnet de Vidal, tu avais commencé par ${bridge.entry}\n${bridge.person} est dans cette pièce.`,4400);
  }

  await showText("Jeudi, 8 h 31.\nBureau de Mme Arnaud.",2600);

  playSafely(porte);
  await runCountdown();
  try{porte.pause();porte.currentTime=0}catch(error){}

  sceneHint.textContent="Écoute…";
  activate(sceneScreen);
  playSafely(narrateur);
  await waitForSound(narrateur,9000);

  zonesUnlocked=true;
  sceneHint.textContent="Touche les personnages que tu veux observer.";
  await exploreScene();

  try{
    localStorage.setItem("qr10_suspect_order",JSON.stringify(suspectOrder));
    localStorage.setItem("qr10_suspects_seen",JSON.stringify([...seen]));
    if(suspectOrder[0])localStorage.setItem("qr10_first_suspect",suspectOrder[0]);
  }catch(error){}

  await fade(sceneScreen);

  const firstLook=suspectOrder[0];
  if(firstLook){
    const firstLine=bridge?`Dans le carnet, tu avais commencé par ${bridge.entry}.\n`:"";
    await showText(`${firstLine}Dans le bureau, ton regard s’est d’abord posé sur ${firstLook}.\n\nCe sont des choix de lecture. Pas des preuves.`,6000);
  }

  mainText.innerHTML=`Dans quelques instants, tu vas lire la suite de ce roman.<br><br>Chaque personnage a une raison d’être dans cette pièce.<span class="sub">Toi aussi, tu sais des choses. Utilise-les.</span>`;
  activate(textScreen);
  await sleep(5200);
  await fade(textScreen);

  buildJourney(firstLook);
  activate(journeyScreen);
}

startBtn.addEventListener("click",run,{once:true});
restartBtn.addEventListener("click",()=>location.reload());
backToBook.addEventListener("click",()=>{
  mainText.innerHTML="Fais-toi confiance.<span class=\"sub\">Tu peux maintenant reprendre ta lecture.</span>";
  activate(textScreen);
  restartBtn.style.display="block";
});

const preload=new Image();
preload.src="touslessuspects.webp";
</script>
</body>
</html>
</html>
