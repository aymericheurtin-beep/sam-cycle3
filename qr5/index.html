<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>QR5</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;width:100%;height:100vh;overflow:hidden;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}

#btn{background:#fff;color:#000;border:none;padding:20px 30px;border-radius:8px;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);cursor:pointer;z-index:30;width:360px;max-width:88vw;white-space:nowrap}
#restart{background:#fff;color:#000;border:none;padding:15px 30px;border-radius:8px;cursor:pointer;position:fixed;bottom:40px;left:50%;transform:translateX(-50%);z-index:30}

.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px;z-index:20}
.screen.active{display:flex}

#question{font-size:clamp(20px,4.5vmin,28px);line-height:1.45;max-width:700px;margin-bottom:36px}
.choice{background:rgba(255,255,255,.1);color:#fff;border:1px solid #fff;padding:15px 25px;border-radius:8px;cursor:pointer;margin:10px 0;width:min(440px,86vw)}
.choice:hover{background:#fff;color:#000}
.choice:active{transform:scale(.98)}

#eyeWrap{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#000;z-index:5}
#eyeContainer{position:relative;display:inline-block}
#eye{max-width:96vw;max-height:88vh;width:auto;height:auto;opacity:0;transition:opacity 1.5s ease;display:block}
#eye.show{opacity:1}

#scanOverlay{position:absolute;inset:0;pointer-events:none;overflow:hidden;display:none}
#scanOverlay.active{display:block}
#scanLine{position:absolute;left:0;right:0;height:4px;background:linear-gradient(90deg,transparent,rgba(0,255,200,.9),transparent);box-shadow:0 0 12px rgba(0,255,200,.8),0 0 24px rgba(0,255,200,.5);animation:scanMove 2.2s linear infinite}
#scanGrid{position:absolute;inset:0;background:repeating-linear-gradient(to bottom,rgba(0,255,200,.07) 0,rgba(0,255,200,.07) 1px,transparent 1px,transparent 4px);mix-blend-mode:screen;opacity:.6}

#finaltext{font-size:clamp(20px,4.5vmin,28px);line-height:1.6;max-width:700px;white-space:pre-line}

button,.choice{font-size:clamp(18px,4vmin,24px);font-family:inherit}
#btn,#restart{font-size:clamp(20px,5vmin,26px)}

@keyframes scanMove{0%{top:-5%}100%{top:105%}}
@media (prefers-reduced-motion:reduce){#eye{transition:none}#scanLine{animation:none;top:50%}}
</style>
</head>
<body>

<button id="btn" type="button">Touche pour commencer</button>

<div id="qscreen" class="screen">
  <div id="question">Comment as-tu imaginé M. Vidal&nbsp;?</div>
  <button type="button" class="choice">Un homme dur</button>
  <button type="button" class="choice">Un homme blessé</button>
  <button type="button" class="choice">Un homme détestable</button>
  <button type="button" class="choice">Autrement</button>
</div>

<div id="eyeWrap">
  <div id="eyeContainer">
    <img id="eye" src="./oeil_vidal_1942_flou.webp" alt="Le regard de M. Vidal, avec une Casio reflétée dans l’œil">
    <div id="scanOverlay">
      <div id="scanGrid"></div>
      <div id="scanLine"></div>
    </div>
  </div>
</div>

<div id="post" class="screen">
  <div id="finaltext"></div>
  <button id="restart" type="button">Recommencer</button>
</div>

<audio id="scanner" src="./scan.mp3" preload="auto" loop playsinline></audio>
<audio id="tictac" src="./tictac.mp3" preload="auto" loop playsinline></audio>
<audio id="voix" src="./audio_vidal.mp3" preload="auto" playsinline></audio>

<script>
function trackScan(id){
  try{
    const usedSet=new Set(JSON.parse(localStorage.getItem('qr_used_set')||'[]'));
    usedSet.add(id);
    const arr=Array.from(usedSet);
    localStorage.setItem('qr_used_set',JSON.stringify(arr));
    localStorage.setItem('scans_used',arr.length);
    localStorage.setItem('scans_total','11');
  }catch(e){
    console.error('Storage error:',e);
  }
}

const btn=document.getElementById('btn');
const qscreen=document.getElementById('qscreen');
const choices=document.querySelectorAll('.choice');
const eyeWrap=document.getElementById('eyeWrap');
const eye=document.getElementById('eye');
const scanOverlay=document.getElementById('scanOverlay');
const post=document.getElementById('post');
const finaltext=document.getElementById('finaltext');
const restart=document.getElementById('restart');
const scanner=document.getElementById('scanner');
const tictac=document.getElementById('tictac');
const voix=document.getElementById('voix');

let choix='';
let finished=false;

btn.onclick=()=>{
  trackScan('qr5');
  btn.remove();
  qscreen.classList.add('active');
};

choices.forEach(choiceBtn=>{
  choiceBtn.onclick=()=>{
    choix=choiceBtn.textContent;
    finished=false;

    try{
      localStorage.setItem('qr5_vidal_imagined',choix);
    }catch(e){
      console.error('Storage error:',e);
    }

    qscreen.classList.remove('active');
    eyeWrap.style.display='flex';
    requestAnimationFrame(()=>eye.classList.add('show'));
    scanOverlay.classList.add('active');

    scanner.volume=.42;
    tictac.volume=.32;
    voix.volume=1;
    scanner.currentTime=0;
    tictac.currentTime=0;
    voix.currentTime=0;

    scanner.play().catch(()=>{});
    setTimeout(()=>tictac.play().catch(()=>{}),180);
    setTimeout(()=>voix.play().catch(finir),1800);
  };
});

function finir(){
  if(finished) return;
  finished=true;

  scanner.pause();
  tictac.pause();
  scanOverlay.classList.remove('active');
  eye.classList.remove('show');

  setTimeout(()=>{
    eyeWrap.style.display='none';
    finaltext.textContent=`Tu avais dit : ${choix}.\nEt maintenant ?`;
    post.classList.add('active');
  },800);
}

voix.onended=finir;
voix.onerror=()=>{
  if(choix) finir();
};
restart.onclick=()=>location.reload();
</script>
</body>
</html>
